name: sudoku
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  intl: any
  confetti: ^0.8.0
  # json_annotation 4.9.x : seule famille compatible avec json_serializable
  # <6.11.3 (qui est lui-même contraint pour rester sur source_gen 2.x,
  # requis par freezed <3.2.0).
  json_annotation: ^4.9.0
  # freezed_annotation forcé en 3.x : riverpod_generator 2.6.5 dépend
  # transitivement de freezed_annotation ^3.0.0 (via riverpod_analyzer_utils).
  freezed_annotation: ^3.0.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  # json_serializable cloué à 6.9.x : dernière famille sur source_gen ^2.x
  # ET build ^2.x (compatible riverpod_generator 2.6.5).
  json_serializable: '>=6.9.0 <6.10.0'
  build_runner: ^2.4.13
  # freezed borné à <3.2.0 : les versions 3.2.5+ exigent analyzer 9+,
  # incompatible avec riverpod_generator (plafonné analyzer 7-8).
  freezed: '>=3.0.0 <3.2.0'
  riverpod_generator: ^2.6.5

# Génération des icônes natives (Android mipmap-* + iOS Assets.xcassets)
# depuis `assets/icon/icon.png` (1254×1254 RGB sans alpha).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

# Splash screen natif.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#141218"
  image: assets/icon/icon_foreground.png
  image_dark: assets/icon/icon_foreground.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#141218"
    image: assets/icon/icon_foreground.png
    image_dark: assets/icon/icon_foreground.png

flutter:
  generate: true
  uses-material-design: true
