name: Release AAB

# Build manuel d'un AAB signé pour soumission Play Store.
# Déclencher depuis l'onglet Actions → Release AAB → Run workflow.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   KEYSTORE_BASE64    base64 du fichier upload-keystore.jks
#   KEYSTORE_PASSWORD  mot de passe du store
#   KEY_PASSWORD       mot de passe de la clé
#   KEY_ALIAS          alias (ex: upload)
#
# TODO (étape suivante) : ajouter un job de publication automatique sur
# le track "internal" Play Store via r0adkll/upload-google-play-action,
# une fois le service account Play Console configuré.

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Suffixe du nom de l''artifact (ex: v1.2.0, rc1)'
        required: false
        default: 'manual'

env:
  FLUTTER_VERSION: '3.41.9'

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-signed-aab:
    name: Build signed release AAB
    needs: analyze-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AAB_NAME: sudoku-${{ inputs.version_suffix }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (Java + Gradle cache inclus)
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          setup-java: 'true'

      - name: Setup Android signing
        uses: ./.github/actions/setup-android-signing
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Rename AAB with version
        run: |
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/${{ env.AAB_NAME }}.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}-aab
          path: build/app/outputs/bundle/release/${{ env.AAB_NAME }}.aab
          if-no-files-found: error
